services:
  neo4j:
    image: neo4j:5.19.0
    networks:
      - opencti_network
    environment:
      - NEO4J_AUTH=neo4j/opencti2025opencti
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - 7474:7474
      - 7687:7687
    volumes:
      - neo4j-data:/data
    restart: always
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    networks:
      - opencti_network
    environment:
      - discovery.type=single-node
      - thread_pool.search.queue_size=5000
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=true
      - logger.org.elasticsearch.discovery="ERROR"
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - network.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 50
      start_period: 90s
    restart: always
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: opencti-minio
    networks:
      - opencti_network
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: opencti
      MINIO_ROOT_PASSWORD: opencti2025opencti
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
  createbuckets:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    networks:
      - opencti_network
    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set myminio http://minio:9000 opencti opencti2025opencti && /usr/bin/mc mb --ignore-existing myminio/opencti-bucket && /usr/bin/mc ls myminio/opencti-bucket; do
          echo 'Waiting for MinIO and bucket to be ready...';
          sleep 5;
        done;
        echo 'Bucket exists';
        tail -f /dev/null
      "
    restart: unless-stopped
  redis:
    image: redis:7.4.0
    networks:
      - opencti_network
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    networks:
      - opencti_network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_NODENAME=rabbit01@localhost
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:rw
      - amqpdata:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl status"]
      interval: 30s
      timeout: 30s
      retries: 5

  opencti:
    image: opencti/platform:6.7.2
    #platform: linux/arm64
    networks:
      - opencti_network
    depends_on:
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      createbuckets:
        condition: service_started
    # volumes:
      #- ./opencti-entrypoint.sh:/docker-entrypoint.sh
    #entrypoint: /docker-entrypoint.sh
    environment:
      # Elasticsearch configuration
      - ELASTICSEARCH__ENGINE_SELECTOR=elk
      - ELASTICSEARCH__URL=http://elasticsearch:9200
      - ELASTICSEARCH__SSL__REJECT_UNAUTHORIZED=false
      - ELASTICSEARCH__NUMBER_OF_REPLICAS=0
      # Core configuration
      - APP__PORT=8080
      - APP__ADMIN__EMAIL=admin@opencti.io
      - APP__ADMIN__PASSWORD=ChangeMePlease
      - APP__ADMIN__TOKEN=4C794102-AB94-46C5-9BDB-57F6C3E9F954
      - APP__BASE_URL=http://localhost:8080
      - APP__APP_LOGS__LOGS_LEVEL=error
      - APP__APP_LOGS__LOGS_CONSOLE=true
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=opencti2025opencti
      # MinIO (S3) configuration
      - MINIO__ENDPOINT=minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=opencti
      - MINIO__SECRET_KEY=opencti2025opencti
      - MINIO__BUCKET_NAME=opencti-bucket
      - MINIO__BUCKET_REGION=us-east-1
      # Other dependencies
      - REDIS__HOSTNAME=redis
      - REDIS__PORT=6379
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__PORT_MANAGEMENT=15672
      - RABBITMQ__MANAGEMENT_SSL=false
      - RABBITMQ__USERNAME=guest
      - RABBITMQ__PASSWORD=guest
      - ELASTIC_MEMORY_SIZE=4G
      - SMTP__HOSTNAME=localhost
      - SMTP__PORT=25
      - PROVIDERS__LOCAL__STRATEGY=LocalStrategy
      - APP__HEALTH_ACCESS_KEY=DEADBEEF070707
      # Connectors (example)
      - CONNECTOR_HISTORY_ID=${CONNECTOR_HISTORY_ID}
      - CONNECTOR_EXPORT_FILE_STIX_ID=${CONNECTOR_EXPORT_FILE_STIX_ID}
      - CONNECTOR_EXPORT_FILE_CSV_ID=${CONNECTOR_EXPORT_FILE_CSV_ID}
      - CONNECTOR_IMPORT_FILE_STIX_ID=${CONNECTOR_IMPORT_FILE_STIX_ID}
      - CONNECTOR_EXPORT_FILE_TXT_ID=${CONNECTOR_EXPORT_FILE_TXT_ID}
      - CONNECTOR_IMPORT_DOCUMENT_ID=${CONNECTOR_IMPORT_DOCUMENT_ID}
      - CONNECTOR_ANALYSIS_ID=${CONNECTOR_ANALYSIS_ID}
      # Debug Networking
      - NODE_OPTIONS=--dns-result-order=ipv4first
      # Debug logging
      - NODE_ENV=development
      - DEBUG=*
      - NODE_OPTIONS=--max-old-space-size=8096
    ports:
      - 8080:8080
    restart: always
    healthcheck:
      test:  ["CMD", "wget", "-qO-", "http://opencti:8080/health?health_access_key=DEADBEEF070707"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    image: opencti/worker:6.7.2
    networks:
      - opencti_network
    #platform: linux/arm64
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - WORKER_LOG_LEVEL=info
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3
    restart: always
  connector-export-file-stix:
    image: opencti/connector-export-file-stix:latest
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileStix2
      - CONNECTOR_SCOPE=application/json
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-csv:
    image: opencti/connector-export-file-csv:latest
    platform: linux/amd64
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_CSV_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileCsv
      - CONNECTOR_SCOPE=text/csv
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-export-file-txt:
    image: opencti/connector-export-file-txt:latest
    platform: linux/amd64
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_EXPORT_FILE_TXT_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_EXPORT_FILE
      - CONNECTOR_NAME=ExportFileTxt
      - CONNECTOR_SCOPE=text/plain
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-file-stix:
    image: opencti/connector-import-file-stix:latest
    platform: linux/amd64
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_FILE_STIX_ID} # Valid UUIDv4
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportFileStix
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true # Validate any bundle before import
      - CONNECTOR_SCOPE=application/json,text/xml
      - CONNECTOR_AUTO=true # Enable/disable auto-import of file
      - CONNECTOR_LOG_LEVEL=info
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-import-document:
    build:
      context: ./custom-connectors/document-processor
      dockerfile: Dockerfile
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_IMPORT_DOCUMENT_ID}
      - CONNECTOR_TYPE=INTERNAL_IMPORT_FILE
      - CONNECTOR_NAME=ImportDocument
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=true
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html,text/markdown
      - CONNECTOR_AUTO=true
      - CONNECTOR_ONLY_CONTEXTUAL=false
      - CONNECTOR_CONFIDENCE_LEVEL=15
      - CONNECTOR_LOG_LEVEL=info
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
      - IMPORT_DOCUMENT_STIX_ENTITIES_FILES=true
      - IMPORT_DOCUMENT_STIX_OBSERVABLES_FILES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
  connector-analysis:
    build:
      context: ./custom-connectors/document-processor
      dockerfile: Dockerfile
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_ANALYSIS_ID}
      - CONNECTOR_TYPE=INTERNAL_ANALYSIS
      - CONNECTOR_NAME=ImportDocumentAnalysis
      - CONNECTOR_VALIDATE_BEFORE_IMPORT=false
      - CONNECTOR_SCOPE=application/pdf,text/plain,text/html,text/markdown
      - CONNECTOR_AUTO=true
      - CONNECTOR_ONLY_CONTEXTUAL=false
      - CONNECTOR_CONFIDENCE_LEVEL=15
      - CONNECTOR_LOG_LEVEL=info
      - IMPORT_DOCUMENT_CREATE_INDICATOR=true
      - IMPORT_DOCUMENT_STIX_ENTITIES_FILES=true
      - IMPORT_DOCUMENT_STIX_OBSERVABLES_FILES=true
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
  connector-alienvault:
    image: opencti/connector-alienvault:6.7.2
    networks:
      - opencti_network
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}  # Use the env variable
      - CONNECTOR_ID=${CONNECTOR_ID}
      - CONNECTOR_NAME=AlienVault
      - CONNECTOR_SCOPE=alienvault
      - CONNECTOR_LOG_LEVEL=info  # Changed from error to info for better debugging
      - CONNECTOR_DURATION_PERIOD=PT30M
      - ALIENVAULT_BASE_URL=https://otx.alienvault.com
      - ALIENVAULT_API_KEY=f2fa90d348d220e8c918b0fe16d6e61161c92edcd7b27a5003726abf325ef07a
      - ALIENVAULT_TLP=White
      - ALIENVAULT_CREATE_OBSERVABLES=true
      - ALIENVAULT_CREATE_INDICATORS=true
      - ALIENVAULT_PULSE_START_TIMESTAMP=2024-01-01T00:00:00  # Changed to a past date
      - ALIENVAULT_REPORT_TYPE=threat-report
      - ALIENVAULT_REPORT_STATUS=New
      - ALIENVAULT_GUESS_MALWARE=false
      - ALIENVAULT_GUESS_CVE=false
      - ALIENVAULT_EXCLUDED_PULSE_INDICATOR_TYPES=FileHash-MD5,FileHash-SHA1
      - ALIENVAULT_ENABLE_RELATIONSHIPS=true
      - ALIENVAULT_ENABLE_ATTACK_PATTERNS_INDICATES=false
      - ALIENVAULT_INTERVAL_SEC=1800
      - ALIENVAULT_DEFAULT_X_OPENCTI_SCORE=50
      - ALIENVAULT_X_OPENCTI_SCORE_IP=60
      - ALIENVAULT_X_OPENCTI_SCORE_DOMAIN=70
      - ALIENVAULT_X_OPENCTI_SCORE_HOSTNAME=75
      - ALIENVAULT_X_OPENCTI_SCORE_EMAIL=70
      - ALIENVAULT_X_OPENCTI_SCORE_FILE=85
      - ALIENVAULT_X_OPENCTI_SCORE_URL=80
      - ALIENVAULT_X_OPENCTI_SCORE_MUTEX=60
      - ALIENVAULT_X_OPENCTI_SCORE_CRYPTOCURRENCY_WALLET=80
    depends_on:
      opencti:
        condition: service_healthy
    restart: always
volumes:
  esdata:
  s3data:
  redisdata:
  neo4j-data:
  amqpdata:
networks:
  opencti_network:
    driver: bridge